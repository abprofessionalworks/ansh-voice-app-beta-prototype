services:
  app:
    build: .
    ports:
      - "8000:8000"
    # Keys are optional: without them the app still starts and shows "Key not set".
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
